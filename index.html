<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Avera Mart">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Avera Mart — বিজনেস ম্যানেজার</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#123C69">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5.10">
</head>
<body>

<!-- ================= LOGIN SCREEN ================= -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <img src="logo.jpg" alt="Avera Mart" class="login-logo">
    <h1>Avera Mart</h1>
    <p class="tagline">প্রকৃতির ছোঁয়া, নিরাপদ আস্থা</p>

    <div id="loginFormWrap">
      <div class="field-group">
        <label>ইমেইল অথবা মোবাইল নম্বর</label>
        <input type="text" id="loginId" placeholder="name@gmail.com অথবা 01XXXXXXXXX" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field-group">
        <label>পাসওয়ার্ড</label>
        <input type="password" id="loginPass" placeholder="আপনার পাসওয়ার্ড" autocomplete="current-password" onkeydown="if(event.key==='Enter')handleLogin()">
      </div>
      <button id="loginBtn" class="btn btn-primary btn-block" onclick="handleLogin()">প্রবেশ করুন</button>
      <div id="loginSetupBox" class="hidden" style="margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);">
        <p class="hint-text" style="margin:0 0 8px;"><b>অ্যাডমিন সেটআপ</b></p>
        <div class="field-group"><input type="password" id="loginPin" placeholder="পুরোনো অ্যাডমিন পিন" inputmode="numeric" maxlength="6" onkeydown="if(event.key==='Enter')handleSetupLogin()"></div>
        <button class="btn btn-outline btn-block" onclick="handleSetupLogin()">পিন দিয়ে সেটআপে যান</button>
      </div>
    </div>
    <p id="loginError" class="error-text"></p>
    <button id="installBtnLogin" class="btn btn-outline btn-block install-btn hidden" onclick="installApp()">📲 অ্যাপ হিসেবে ইনস্টল করুন</button>
    <p id="iosHint" class="hint-text hidden">iPhone/iPad-এ: Safari-র শেয়ার (⬆️) বাটন চেপে "Add to Home Screen" বেছে নিন।</p>
    <p id="appVersionLogin" class="hint-text" style="margin-top:10px;"></p>
    <p id="loginStatus" class="hint-text">☁️ ক্লাউড ডেটাবেজের সাথে সংযোগ করা হচ্ছে...</p>
  </div>
</div>

<!-- ================= APP SHELL ================= -->
<div id="appShell" class="app-shell hidden">

  <div id="sidebarBackdrop" class="sidebar-backdrop" onclick="toggleSidebar()"></div>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="logo.jpg" alt="logo">
      <div>
        <div class="brand-name">Avera Mart</div>
        <div class="brand-tag">প্রকৃতির ছোঁয়া, নিরাপদ আস্থা</div>
      </div>
    </div>
    <nav id="sideNav" class="side-nav"></nav>
    <div class="sidebar-footer">
      <div id="sessionInfo" class="session-info"></div>
      <div id="appVersionSide" class="session-info ver-line"></div>
      <div class="sf-grid">
        <a id="manualLink" class="btn btn-ghost sf-btn hidden" href="manual.pdf" target="_blank">📖 নির্দেশিকা</a>
        <button class="btn btn-ghost sf-btn" onclick="openChangePassword()">🔑 পাসওয়ার্ড</button>
        <button class="btn btn-ghost sf-btn" onclick="forceRefreshApp()">🔄 আপডেট</button>
        <button class="btn btn-ghost sf-btn" onclick="handleLogout()">⎋ লগ-আউট</button>
      </div>
      <button id="installBtnSide" class="btn btn-ghost sf-btn install-btn hidden" onclick="installApp()" style="width:100%;margin-top:6px;">📲 অ্যাপ ইনস্টল করুন</button>
    </div>
  </aside>

  <main class="main-area">
    <header class="top-bar">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <h2 id="pageTitle" style="flex:1;min-width:0;">ড্যাশবোর্ড</h2>
      <div class="export-btns" id="exportBtns">
        <button onclick="exportExcel()" title="এই পেইজের তালিকা Excel ফাইলে নামান">📊<span class="ex-l"> Excel</span></button>
        <button onclick="exportPdf()" title="এই পেইজ PDF ফাইলে নামান">📄<span class="ex-l"> PDF</span></button>
      </div>
    </header>
    <div id="pageContent" class="page-content"></div>
  </main>
</div>

<!-- print-only invoice container -->
<div id="printArea" class="print-area"></div>

<!-- Firebase (compat SDK — no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js?v=5.10"></script>
<script src="secure.js?v=5.10"></script>
<script src="webshop.js?v=5.10"></script>
</body>
</html>
